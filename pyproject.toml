[project]
name = "deployguard"
version = "0.1.0"
description = "System-One-style deployment risk decision models"
requires-python = ">=3.11"
dependencies = [
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
train = ["torch>=2.6,<3", "transformers>=4.48,<5", "datasets>=3,<5", "accelerate>=1,<2"]
dev = ["pytest>=8,<9"]
cloud = ["modal>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
